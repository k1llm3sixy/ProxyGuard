file-version: 1

# Available providers:
# VPN_API - https://vpnapi.io/
# PROXY_CHECK - https://proxycheck.io/
provider: PROXY_CHECK

# Uncomment and set your API key if using VPN_API provider
#vpn-api-key:

# Uncomment and set your API key if using PROXY_CHECK provider
#proxycheck-api-key:

# Plugin messages
# Sent when config is reloaded (/proxyguard reload)
msg-config-reload: "<green>ProxyGuard config successfully reloaded"

# Sent when the user database is empty
msg-users-empty: "<red>No users!"

# User entry format for the list output
msg-users: "<dark_gray>• <green><nick> <dark_gray>| <gray>IP: <yellow><ip> <dark_gray>| <gray>UUID: <white><uuid>"

# Sent when a user is unbanned (/proxyguard unban <uuid>)
msg-unban-user: "<green>User <white><uuid> <green>unbanned"

# Kick message
kick-message: "VPN|Proxy detected"

# Sent when changing the active provider via command (/proxyguard settings provider <name>)
msg-set-provider: "<green>Provider set to: <white><provider>"

# Sent when toggling Discord notifications on (/proxyguard settings discord enable)
msg-ds-enable: "<green>Discord alerts enabled"

# Sent when toggling Discord notifications off (/proxyguard settings discord disable)
msg-ds-disable: "<red>Discord alerts disabled"

# Sent when updating Discord embed title (/proxyguard settings discord embed title <text>)
msg-ds-embed-title: "<green>Discord embed title set to: <white><title>"

# Sent when updating Discord embed description (/proxyguard settings discord embed description <text>)
msg-ds-embed-description: "<green>Discord embed description set to: <white><description>"

# Sent when updating Discord embed reason (/proxyguard settings discord embed reason <text>)
msg-ds-embed-reason: "<green>Discord embed reason set to: <white><reason>"

# Sent when passing an invalid IP to a whitelist command
msg-invalid-ip: "<red>Invalid IP format!"

# Sent when passing an invalid url to a discord webhook command
msg-invalid-webhook: "<red>Invalid Webhook url!"

# Sent when an IP is added to the whitelist (/proxyguard whitelist add <ip>)
msg-whitelist-add: "<green>IP <white><ip> <green>added to whitelist"

# Sent when an IP is removed from the whitelist (/proxyguard whitelist remove <ip>)
msg-whitelist-remove: "<green>IP <white><ip> <green>removed from whitelist"

# Entry format for the whitelist list output (/proxyguard whitelist list)
msg-whitelist-list: "<dark_gray>• <white>IP<dark_gray>: <yellow><ip>"

# Sent when the whitelist is empty (/proxyguard whitelist list)
msg-whitelist-empty: "<dark_gray>• <red>There are no whitelisted IPs"

# Discord notification settings
discord:
  # Enable or disable sending detection logs to Discord webhook
  enabled: false
  # Discord webhook URL
  webhook: "https://discord.com/api/webhooks/..."
  # Title displayed at the top of the Discord embed message
  embed-title: "Player blocked"
  # Explanation of the event shown in the embed body
  embed-description: "A player was blocked while attempting to join the server with an active proxy or VPN"
  # Field specifying the detailed reason for the block
  embed-reason: "VPN|Proxy detected"